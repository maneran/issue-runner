# Copy to repos.yml (gitignored). The admin's control file for the local runner.
schedule: {hour: 6, minute: 0}     # local time; scripts/install-launchd.sh reads it
claude_bin: claude                 # Claude Code CLI; runs under your own login (Pro/Max)
repos:
  - path: ~/Development/wp-content-agent
    config:                        # same keys as examples/issue-runner.yml
      stages: []                   # [] = plan and report only; [triage, implement] = full Run
      quota: 0
      per_issue_minutes: 45            # default cap; size labels override it below
      minutes_by_size: {S: 20, M: 45, default: 45}
      max_continuations: 3             # capped sessions on one issue before it goes ready-for-human
      triage_minutes: 20
      stale_days: 7
      models: {triage: claude-sonnet-5, implement: claude-opus-5}
      budget: {hours_month: 25}
      show_api_equivalent: false       # true adds a "what this would cost on the API" figure; never a bill
      base_branch: develop
      # allowed_tools: [...]       # override the loop's default allow-list for claude -p
      setup:                       # run in each fresh worktree before the session (the checkout's .venv is symlinked in)
        - cd ui && npm ci --prefer-offline --no-audit --no-fund --loglevel=error
      env:                         # CI's test placeholders, for the session's commands
        # Lowercase on purpose: pydantic-settings matches either case, while Claude Code reads only
        # ANTHROPIC_API_KEY, which the loop strips so the session stays on the subscription.
        anthropic_api_key: test-placeholder
        # A closed port: tests that need Postgres or Redis fail fast (CI runs them) instead of
        # reaching the docker dev stack on 5432/6379. The sandbox blocks localhost too.
        database_url: postgresql://none:none@127.0.0.1:1/none
        redis_url: redis://127.0.0.1:1
        supabase_url: https://placeholder.supabase.co
        encryption_key: dGVzdC1rZXktMzItYnl0ZXMtZm9yLWNpLXRlc3Rpbmc=  # CI's test key, not a secret
